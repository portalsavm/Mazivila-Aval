<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redirecionando...</title>
<style>body{font-family:Segoe UI,Arial;text-align:center;padding:50px;background:#f5f7fa}</style>
</head>
<body>
<h2>Carregando prova...</h2>
<p>Se não redirecionar em 3s, o link é inválido.</p>
<script>
const FIREBASE = "https://maziva--links-default-rtdb.firebaseio.com/links";
const id = location.pathname.split('/').pop(); // pega T59JYJ

fetch(`${FIREBASE}/${id}.json`)
.then(r=>r.json())
.then(url=>{
  if(url) location.replace(url); // redireciona pro link gigante
  else document.body.innerHTML="<h2>Link inválido ou expirado</h2>";
})
.catch(()=>document.body.innerHTML="<h2>Erro ao carregar link</h2>");
</script>
</body>
</html>
