<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecionando...</title>
<style>
  body{font-family:Segoe UI,Arial;text-align:center;padding:80px;background:#f5f7fa;color:#333}
  .loader{border:5px solid #f3f3f3;border-top:5px solid #3498db;border-radius:50%;width:50px;height:50px;animation:spin 1s linear infinite;margin:20px auto}
  @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>
</head>
<body>
  <h2>Carregando...</h2>
  <div class="loader"></div>
  <p>Aguarde um momento</p>

<script>
  // 1. PEGA O ID DA URL: ?id=JL0WRJ
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  if(!id){
    document.body.innerHTML = "<h2>Link inválido</h2><p>Faltou o ID</p>";
  } else {
    // 2. BUSCA NO FIREBASE
    const firebaseURL = `https://maziva--links-default-rtdb.firebaseio.com/links/${id}.json`;
    
    fetch(firebaseURL)
      .then(r => r.json())
      .then(url => {
        if(url){
          // 3. REDIRECIONA
          window.location.replace(url);
        } else {
          document.body.innerHTML = "<h2>Link inválido ou expirado</h2><p>Este ID não existe no sistema.</p>";
        }
      })
      .catch(() => {
        document.body.innerHTML = "<h2>Erro de conexão</h2><p>Não foi possível acessar o Firebase.</p>";
      });
  }
</script>
</body>
</html>
