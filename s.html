<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecionando... SAVM</title>
<style>
body{font-family:Arial;text-align:center;padding-top:80px;background:#0a4d68;color:#fff}
.loader{border:5px solid #f3f3f3;border-top:5px solid #28a745;border-radius:50%;width:50px;height:50px;animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>
</head>
<body>
<h2>Carregando Avaliação SAVM...</h2>
<div class="loader"></div>
<p id="erro"></p>
<script>
const id = new URLSearchParams(location.search).get('id');
const banco = JSON.parse(localStorage.getItem('SAVM_LINKS') || '{}');

if(banco[id]){
    location.replace(banco[id]); // Abre o link gigante
} else {
    document.getElementById('erro').innerHTML = "Erro: Link não encontrado.<br>Peça um novo link ao professor.";
    document.getElementById('erro').style.color = "#ffcc00";
}
</script>
</body>
</html>
