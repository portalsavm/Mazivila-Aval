<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAVM - Sistema de Avaliação Virtual Mazivila</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f4f6f9}
header{background:#0a4d68;color:#fff;padding:20px;text-align:center}
header h1{margin:0;font-size:24px}
.container{max-width:900px;margin:20px auto;padding:20px;background:#fff;border-radius:8px}
input,textarea{width:100%;padding:8px;margin:5px 0;border:1px solid #ccc;border-radius:4px}
.pergunta{border:1px dashed #0a4d68;padding:15px;margin:15px 0;border-radius:6px;background:#f8f9fa}
.btn{background:#0a4d68;color:#fff;border:none;padding:10px 18px;border-radius:5px;cursor:pointer;margin:5px;font-weight:bold}
.btn-green{background:#28a745}.btn-red{background:#dc3545}
.hidden{display:none}
.resultado{background:#e7f3ff;padding:15px;margin-top:10px;border-radius:5px;border-left:4px solid #0a4d68}
#tela-aluno{position:fixed;inset:0;background:#fff;z-index:9999;overflow:auto;padding:15px}
#contadorSaidas{position:fixed;top:10px;right:10px;background:#dc3545;color:#fff;padding:10px;border-radius:8px;font-weight:bold;z-index:10000}
.comprovativo{text-align:center;padding:30px;background:#d4edda;border:3px solid #28a745;border-radius:10px}
.nota{font-size:50px;color:#28a745;font-weight:bold;margin:15px 0}
.questao{margin:20px 0;padding-bottom:10px;border-bottom:1px solid #eee}
.escola-cabecalho{text-align:center;padding:10px;background:#0a4d68;color:#fff;margin-bottom:15px;border-radius:5px}
</style>
</head>
<body>

<header>
    <h1>Escola Secundária de Mazivila</h1>
  <p>SAVM-Sistema de Avaliação Virtual Mazivila</p>
</header>

<div class="container" id="tela-prof">
  <h2>I.Dados</h2>
  <label>Tipo de Avaliação <input id="tipo"></label>
  <label>Disciplina <input id="disciplina"></label>
  <label>Classe <input id="classe"></label>
  <label>Data de avaliação<input id="data" type="date"></label>
  <label>Nº do WhatsApp do professor<input id="whats" placeholder="25884xxxxxxx"></label>
  <label>Nº de Perguntas <input id="nPerg" type="number" value="2"></label>
  <label>Cotação Total <input id="cot" type="number" value="20"></label>
  <label>Nº de saídas permitidas <input id="saidas" type="number" value="3"></label>

  <h2>II.Perguntas da avaliação</h2>
  <div id="perguntas"></div>
  <button class="btn" onclick="addP()">+ Adicionar Pergunta</button>

  <h2>III.Gerar Avaliação</h2>
  <button class="btn" onclick="gerarECurtar()">Gerar Link Curto do Teste</button>
  <div id="link" class="hidden resultado"></div>

</div>

<div id="tela-aluno" class="hidden"></div>

<script>
const { jsPDF } = window.jspdf;
let banco=[], aluno={}, saidas=3, perguntas=[], respostasAluno=[], cont=0, config=null, travou=false, notaFinal=0, cotacaoFinal=20;
const NOME_ESCOLA = "Escola Secundária de Mazivila";
const $ = id => document.getElementById(id);

function addP(){
  const i=cont++;
  const div = document.createElement('div');
  div.className = 'pergunta';
  div.id = 'p'+i;
  div.innerHTML = `<button style="float:right;background:#dc3545;color:#fff;border:none;padding:5px 10px;border-radius:3px" onclick="this.parentElement.remove()">X</button>
    <label><b>Pergunta ${i+1}</b></label><textarea id="e${i}" placeholder="Digite a pergunta"></textarea>
    <label><input type="radio" name="c${i}" value="0"> <input id="o${i}0" placeholder="Opção A"></label>
    <label><input type="radio" name="c${i}" value="1"> <input id="o${i}1" placeholder="Opção B"></label>
    <label><input type="radio" name="c${i}" value="2"> <input id="o${i}2" placeholder="Opção C"></label>
    <label><input type="radio" name="c${i}" value="3"> <input id="o${i}3" placeholder="Opção D"></label>`;
  $('perguntas').appendChild(div);
}
addP(); addP();

function formatarWhats(num){ let n = num.replace(/\D/g,''); if(n.startsWith('258')) return n; if(n.startsWith('0')) n = n.substring(1); return '258' + n; }
function coletar(){ banco=[]; document.querySelectorAll('.pergunta').forEach(p=>{ const i=p.id.substring(1); const en=$(`e${i}`)?.value.trim(); const ce=$(`input[name="c${i}"]:checked`); const op=[0,1,2,3].map(j=>$(`o${i}${j}`)?.value.trim()||"").filter(x=>x!=""); if(en && op.length >= 2){ banco.push({enun:en, opcoes:op, certa:ce?parseInt(ce.value):0}); } }); if(banco.length == 0){ alert("Adicione pelo menos 1 pergunta completa"); return null; } return { tipo:$('tipo').value, disciplina:$('disciplina').value, classe:$('classe').value, data:$('data').value, whats:formatarWhats($('whats').value), nPerg:$('nPerg').value, cotacao:$('cot').value, saidas:$('saidas').value, senha:`SAVM-${$('classe').value}-${$('disciplina').value}-${$('tipo').value}-${$('data').value}`.toUpperCase(), perguntas:banco } }
const cod = c => btoa(encodeURIComponent(JSON.stringify(c))); 
const dec = c => JSON.parse(decodeURIComponent(atob(c))); 
const gerarId = () => Math.random().toString(36).substr(2,6).toUpperCase();

function gerarECurtar(){ const c=coletar(); if(!c) return; if(!c.whats){alert("Preencha o WhatsApp do professor com números");return;} const linkGigante = location.href.split('?')[0]+'?t='+cod(c); const id = gerarId(); let bancoLinks = JSON.parse(localStorage.getItem('SAVM_LINKS') || '{}'); bancoLinks[id] = linkGigante; localStorage.setItem('SAVM_LINKS', JSON.stringify(bancoLinks)); const linkCurto = location.href.split('?')[0].replace('index.html','') + 's.html?id=' + id; $('link').classList.remove('hidden'); $('link').innerHTML=`<b>✓ Link Curto Gerado:</b><br><a href="${linkCurto}" target="_blank">${linkCurto}</a><br><button class="btn btn-green" onclick="navigator.clipboard.writeText('${linkCurto}');alert('Copiado')">Copiar</button>`; }

function abrir(){ 
  const u=new URLSearchParams(location.search); 
  const t=u.get('t'); 
  if(!t) return; 
  config=dec(t); 
  $('tela-prof').classList.add('hidden'); 
  $('tela-aluno').classList.remove('hidden'); 
  saidas=parseInt(config.saidas)||3; 
  $('tela-aluno').innerHTML=`<div id="contadorSaidas">Saídas: ${saidas}</div><div class="escola-cabecalho"><h2>${NOME_ESCOLA}</h2></div><h3>Avaliação Virtual</h3><p><b>${config.tipo} - ${config.disciplina}</b></p><label>Nome<input id="n"></label><label>Turma<input id="tu"></label><label>Nº<input id="num"></label><button class="btn btn-green" onclick="iniciar()">Iniciar</button>`; 
}
function iniciar(){ aluno={nome:$('n').value.trim(),turma:$('tu').value.trim(),num:$('num').value.trim()}; if(!aluno.nome||!aluno.turma||!aluno.num){alert("Preencha todos");return;} montar(); }
function embaralhar(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a}
function salvarResposta(i, val){ respostasAluno[i] = parseInt(val); }
function montar(){ respostasAluno = []; let basePerg = [...config.perguntas]; if(config.nPerg) basePerg=basePerg.slice(0,parseInt(config.nPerg)); perguntas = []; let html=`<div id="contadorSaidas">Saídas: ${saidas}</div><div class="escola-cabecalho"><h2>${NOME_ESCOLA}</h2></div><h3>${config.disciplina}</h3>`; basePerg.forEach((p,i)=>{ let ops=p.opcoes.map((o,j)=>({txt:o, idx:j})); ops=embaralhar(ops); perguntas.push({gab:p.certa}); html+=`<div class="questao"><p><b>${i+1}.</b> ${p.enun}</p>`; ops.forEach((o,j)=>html+=`<label><input type="radio" name="q${i}" value="${o.idx}" onchange="salvarResposta(${i},${o.idx})"> ${o.txt}</label><br>`); html+=`</div>`; }); html+=`<button class="btn btn-red" onclick="finalizar()">FINALIZAR</button>`; $('tela-aluno').innerHTML=html; }
function finalizar(){ let ac=0; perguntas.forEach((p,i)=>{ if(respostasAluno[i] === p.gab) ac++; }); const totalQ = perguntas.length; cotacaoFinal = parseFloat(config.cotacao) || 20; notaFinal = totalQ > 0? ((ac / totalQ) * cotacaoFinal).toFixed(1) : 0; alert(`Nota: ${notaFinal}/${cotacaoFinal}`); }

// ESTA LINHA É A MAIS IMPORTANTE: Ela abre a prova se tiver?t= no link
if(location.search.includes('t=')) abrir();
</script>
</body>
</html>
