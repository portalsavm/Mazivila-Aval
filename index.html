<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAVM - Sistema de Avaliação Virtual Mazivila</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f4f6f9}
header{background:#0a4d68;color:#fff;padding:20px;text-align:center}
header h1{margin:0;font-size:24px}
.container{max-width:900px;margin:20px auto;padding:20px;background:#fff;border-radius:8px}
input,textarea{width:100%;padding:8px;margin:5px 0;border:1px solid #ccc;border-radius:4px}
.pergunta{border:1px dashed #0a4d68;padding:15px;margin:15px 0;border-radius:6px;background:#f8f9fa;position:relative}
.btn{background:#0a4d68;color:#fff;border:none;padding:10px 18px;border-radius:5px;cursor:pointer;margin:5px;font-weight:bold}
.btn-green{background:#28a745}.btn-red{background:#dc3545}.btn-whats{background:#25D366}.btn-blue{background:#007bff}.btn-excel{background:#217346}.btn-small{padding:8px 12px;font-size:18px}
.hidden{display:none}
.resultado{background:#e7f3ff;padding:15px;margin-top:10px;border-radius:5px;border-left:4px solid #0a4d68}
#tela-aluno{position:fixed;inset:0;background:#fff;z-index:9999;overflow:auto;padding:15px}
#contadorSaidas{position:fixed;top:10px;right:10px;background:#dc3545;color:#fff;padding:10px;border-radius:8px;font-weight:bold;z-index:10000}
.comprovativo{text-align:center;padding:30px;background:#d4edda;border:3px solid #28a745;border-radius:10px}
.nota{font-size:50px;color:#28a745;font-weight:bold;margin:15px 0}
.questao{margin:20px 0;padding-bottom:10px;border-bottom:1px solid #eee;text-align:center}
.questao img{max-width:400px;width:100%;height:auto;margin:10px auto;display:block;border:1px solid #ccc;border-radius:5px}
.escola-cabecalho{text-align:center;padding:10px;background:#0a4d68;color:#fff;margin-bottom:15px;border-radius:5px}
.erro{border:2px solid red!important}
.bloqueado{text-align:center;padding:50px;background:#f8d7da;border:3px solid #dc3545;border-radius:10px;color:#721c24}
.aviso-vermelho{color:#dc3545;font-size:12px;font-weight:bold;margin-bottom:8px}
label input[type="radio"]{width:auto;margin-right:5px}
.img-box{border:1px solid #ccc;padding:10px;border-radius:5px;margin:10px 0;background:#fff;text-align:center}
.preview-img{max-width:400px;width:100%;height:auto;margin:10px auto;display:block;border:1px solid #ccc;border-radius:4px;position:relative}
.btn-remove-img{position:absolute;top:5px;right:5px;background:#dc3545;color:#fff;border:none;border-radius:50%;width:25px;height:25px;cursor:pointer;font-weight:bold}
.img-opcoes{display:flex;justify-content:center;gap:10px;margin-top:8px}
#cameraModal{position:fixed;inset:0;background:#000;z-index:10001;display:none;flex-direction:column;align-items:center;justify-content:center}
#cameraVideo{width:100%;max-width:500px}
#cameraCanvas{display:none}
.camera-botoes{margin-top:10px}
table{width:100%;border-collapse:collapse;margin-top:15px}
table th{background:#0a4d68;color:#fff;padding:10px;text-align:left}
table td{padding:10px;border-bottom:1px solid #ddd}
</style>
</head>
<body>

<header>
    <h1>Escola Secundária de Mazivila</h1>
  <p>SAVM-Sistema de Avaliação Virtual Mazivila</p>
</header>

<div class="container" id="tela-prof">
  <h2>I.Dados</h2>
  <label>Tipo de Avaliação <input id="tipo" placeholder="1ªACS/2ªACS/Teste de recuperação/Trabalho"></label>
  <label>Disciplina <input id="disciplina"></label>
  <label>Classe <input id="classe" placeholder=""></label>
  <label>Data de avaliação<input id="data" type="date"></label>
  <label>Nº do WhatsApp do professor<input id="whats" placeholder="+258xxxxxxxxx"></label>
  <label>Nº de Perguntas <input id="nPerg" type="number" value=""></label>
  <label>Cotação Total <input id="cot" type="number" value="20"></label>
  <label>Nº de saídas permitidas <input id="saidas" type="number" value="" min="1"></label>

  <h2>II.Perguntas da avaliação</h2>
  <div id="perguntas"></div>
  <button class="btn" onclick="addP()">+ Adicionar Pergunta</button>

  <h2>III.Gerar Avaliação</h2>
  <button class="btn" onclick="gerarECurtar()">Gerar Link</button>
  <button class="btn btn-blue" onclick="verRelatorio()"> Relatório de Notas</button>
  <div id="link" class="hidden resultado"></div>
  <div id="relatorio" class="hidden resultado"></div>

</div>

<div id="tela-aluno" class="hidden"></div>

<div id="cameraModal">
  <video id="cameraVideo" autoplay playsinline></video>
  <canvas id="cameraCanvas"></canvas>
  <div class="camera-botoes">
    <button class="btn btn-green" onclick="tirarFoto()">Tirar Foto</button>
    <button class="btn btn-red" onclick="fecharCamera()">Cancelar</button>
  </div>
</div>

<script>
const { jsPDF } = window.jspdf;
let banco=[], aluno={}, saidas=3, perguntas=[], respostasAluno=[], cont=0, config=null, notaFinal=0, cotacaoFinal=20, linkGerado="", provaIniciada=false;
let streamAtual=null, perguntaCameraAtual=null;
const NOME_ESCOLA = "Escola Secundária de Mazivila";
const $ = id => document.getElementById(id);

function addP(){
  const i=cont++;
  const div = document.createElement('div');
  div.className = 'pergunta';
  div.id = 'p'+i;
  div.innerHTML = `<button style="float:right;background:#dc3545;color:#fff;border:none;padding:5px 10px;border-radius:3px" onclick="this.parentElement.remove()">X</button>
    <p class="aviso-vermelho">Aviso: Marque a alternativa A como correta</p>
    <label><b>Pergunta ${i+1}</b></label><textarea id="e${i}" placeholder="Digite a pergunta"></textarea>

    <div class="img-box">
      <b>Imagem da Pergunta - Opcional</b>
      <div id="imgContainer${i}"></div>
      <div class="img-opcoes">
        <label class="btn btn-small" title="Galeria">🖼️<input type="file" id="galeria${i}" accept="image/*" style="display:none" onchange="lerArquivo(this, ${i})"></label>
        <button class="btn btn-small" title="Câmera" onclick="abrirCamera(${i})">📷</button>
        <a href="https://www.google.com/imghp" target="_blank" class="btn btn-small" title="Buscar no Google">🔍</a>
      </div>
      <input type="hidden" id="img${i}">
    </div>

    <label><input type="radio" name="c${i}" value="0" checked> <input id="o${i}0" placeholder="Opção A"></label>
    <label><input type="radio" name="c${i}" value="1"> <input id="o${i}1" placeholder="Opção B"></label>
    <label><input type="radio" name="c${i}" value="2"> <input id="o${i}2" placeholder="Opção C"></label>
    <label><input type="radio" name="c${i}" value="3"> <input id="o${i}3" placeholder="Opção D"></label>`;
  $('perguntas').appendChild(div);
}
addP(); addP();

async function abrirCamera(i){
  perguntaCameraAtual = i;
  $('cameraModal').style.display = 'flex';
  try{
    streamAtual = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}});
    $('cameraVideo').srcObject = streamAtual;
  }catch(e){
    alert("Não foi possível acessar a câmera: " + e.message + "\n\nDica: Use em https://");
    fecharCamera();
  }
}

function fecharCamera(){
  $('cameraModal').style.display = 'none';
  if(streamAtual){
    streamAtual.getTracks().forEach(track => track.stop());
    streamAtual = null;
  }
}

function tirarFoto(){
  const video = $('cameraVideo');
  const canvas = $('cameraCanvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
  setImagem(perguntaCameraAtual, dataUrl);
  fecharCamera();
}

function lerArquivo(input, i){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => setImagem(i, ev.target.result);
  reader.readAsDataURL(file);
  input.value = "";
}

function setImagem(i, src){
  $(`img${i}`).value = src;
  $(`imgContainer${i}`).innerHTML = `<div style="position:relative;display:inline-block"><img src="${src}" class="preview-img"><button class="btn-remove-img" onclick="removerImagem(${i})">X</button></div>`;
}

function removerImagem(i){
  $(`img${i}`).value = "";
  $(`imgContainer${i}`).innerHTML = "";
}

function formatarWhats(num){ let n = num.replace(/\D/g,''); if(n.startsWith('258')) return n; if(n.startsWith('0')) n = n.substring(1); return '258' + n; }

function coletar(){
  banco=[];
  document.querySelectorAll('.pergunta').forEach(p=>{
    const i=p.id.substring(1);
    const en=$(`e${i}`)?.value.trim();
    const ce=$(`input[name="c${i}"]:checked`);
    const op=[0,1,2,3].map(j=>$(`o${i}${j}`)?.value.trim()||"").filter(x=>x!="");
    const imagem = $(`img${i}`)?.value.trim();

    if(en && op.length >= 2){ banco.push({enun:en, opcoes:op, certa:ce?parseInt(ce.value):0, imagem: imagem || ""}); }
  });
  if(banco.length == 0){ alert("Adicione pelo menos 1 pergunta completa"); return null; }
  let saidasProf = parseInt($('saidas').value);
  if(saidasProf < 1) saidasProf = 1;
  const senha = `SAVM-${$('classe').value}-${$('disciplina').value}-${$('tipo').value}-${$('data').value}`.toUpperCase();
  return { tipo:$('tipo').value, disciplina:$('disciplina').value, classe:$('classe').value, data:$('data').value, whats:formatarWhats($('whats').value), nPerg:$('nPerg').value, cotacao:$('cot').value, saidas:saidasProf, senha: senha, perguntas:banco }
}

const cod = c => btoa(encodeURIComponent(JSON.stringify(c)));
const dec = c => JSON.parse(decodeURIComponent(atob(c)));
const gerarId = () => Math.random().toString(36).substr(2,6).toUpperCase();

function gerarECurtar(){
  const c=coletar();
  if(!c) return;
  if(!c.tipo ||!c.disciplina ||!c.classe ||!c.data){alert("Preencha Tipo, Disciplina, Classe e Data");return;}
  if(!c.whats){alert("Preencha o WhatsApp do professor com números");return;}

  const linkGigante = location.href.split('?')[0]+'?t='+cod(c);
  const id = gerarId();
  let bancoLinks = JSON.parse(localStorage.getItem('SAVM_LINKS') || '{}');
  bancoLinks[id] = linkGigante;
  localStorage.setItem('SAVM_LINKS', JSON.stringify(bancoLinks));
  linkGerado = location.href.split('?')[0].replace('index.html','') + 's.html?id=' + id;

  $('link').classList.remove('hidden');
  $('relatorio').classList.add('hidden');
  $('link').innerHTML=`<b>Link Curto Gerado:</b><br><a href="${linkGerado}" target="_blank">${linkGerado}</a><br>
  <button class="btn btn-green" onclick="navigator.clipboard.writeText('${linkGerado}');alert('Copiado')">Copiar</button>
  <button class="btn btn-whats" onclick="enviarWhats()">Enviar no WhatsApp</button>`;
}

function verRelatorio(){
  const c=coletar();
  if(!c) return;
  if(!c.tipo ||!c.disciplina ||!c.classe ||!c.data){alert("Preencha Tipo, Disciplina, Classe e Data primeiro");return;}

  $('link').classList.add('hidden');
  $('relatorio').classList.remove('hidden');

  let html = `<h3>Relatório: ${c.tipo} - ${c.disciplina} - ${c.classe}</h3>`;
  html += `<button class="btn btn-excel" onclick="exportarExcel()">Exportar Excel</button>`;
  html += `<button class="btn btn-red" onclick="apagarRelatorio()">Apagar Notas dessa Prova</button>`;
  html += `<table id="tabelaNotas"><tr><th>Nome</th><th>Turma</th><th>Nº</th><th>Nota</th><th>Data</th></tr>`;

  let achou = false;
  for(let i=0; i<localStorage.length; i++){
    const chave = localStorage.key(i);
    if(chave.startsWith(`SAVM_FEITO_${c.senha}`)){
      const dados = JSON.parse(localStorage.getItem(chave));
      const partes = chave.split('_');
      const turma = partes[partes.length-2];
      const num = partes[partes.length-1];
      html += `<tr><td>${dados.nome}</td><td>${turma}</td><td>${num}</td><td><b>${dados.nota}/${c.cotacao}</b></td><td>${dados.data}</td></tr>`;
      achou = true;
    }
  }

  if(!achou) html += `<tr><td colspan="5">Nenhum aluno fez esta prova ainda.</td></tr>`;
  html += `</table>`;
  $('relatorio').innerHTML = html;
}

function apagarRelatorio(){
  const c=coletar();
  if(!c) return;
  if(!confirm(`Tem certeza que quer apagar TODAS notas de ${c.tipo} - ${c.disciplina} - ${c.classe}?\n\nEssa ação não pode ser desfeita.`)) return;

  let apagados = 0;
  for(let i=localStorage.length-1; i>=0; i--){
    const chave = localStorage.key(i);
    if(chave.startsWith(`SAVM_FEITO_${c.senha}`)){
      localStorage.removeItem(chave);
      apagados++;
    }
  }
  alert(`${apagados} notas apagadas com sucesso!`);
  verRelatorio();
}

function exportarExcel(){
  const c=coletar();
  let dados = [];
  dados.push(["Nome", "Turma", "Nº", "Nota", "Data"]);

  for(let i=0; i<localStorage.length; i++){
    const chave = localStorage.key(i);
    if(chave.startsWith(`SAVM_FEITO_${c.senha}`)){
      const dadosAluno = JSON.parse(localStorage.getItem(chave));
      const partes = chave.split('_');
      const turma = partes[partes.length-2];
      const num = partes[partes.length-1];
      dados.push([dadosAluno.nome, turma, num, `${dadosAluno.nota}/${c.cotacao}`, dadosAluno.data]);
    }
  }
  const ws = XLSX.utils.aoa_to_sheet(dados);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Notas");
  XLSX.writeFile(wb, `Relatorio_${c.disciplina}_${c.classe}_${c.tipo}.xlsx`);
}

function enviarWhats(){
  const texto = `Olá! Link da avaliação SAVM - ${$('disciplina').value} - ${$('classe').value}%0A*Tipo:* ${$('tipo').value} *Data:* ${$('data').value}%0A%0A${linkGerado}`;
  const url = `https://wa.me/${$('whats').value}?text=${texto}`;
  window.open(url, '_blank');
}

function abrir(){
  const u=new URLSearchParams(location.search);
  const t=u.get('t');
  if(!t) return;
  config=dec(t);
  $('tela-prof').classList.add('hidden');
  $('tela-aluno').classList.remove('hidden');
  saidas=parseInt(config.saidas)||1;
  $('tela-aluno').innerHTML=`<div id="contadorSaidas">Saídas: ${saidas}</div><div class="escola-cabecalho"><h2>${NOME_ESCOLA}</h2></div><h3>Avaliação Virtual</h3><p><b>${config.tipo} - ${config.disciplina} - ${config.classe}</b></p><label>Nome<input id="n"></label><label>Turma<input id="tu"></label><label>Nº<input id="num"></label><button class="btn btn-green" onclick="iniciar()">Iniciar</button>`;
}

function getChaveAluno(turma, num, senha){
  return `SAVM_FEITO_${senha}_${turma}_${num}`.toUpperCase();
}

function iniciar(){
  const nome = $('n').value.trim();
  const turma = $('tu').value.trim();
  const num = $('num').value.trim();

  $('tu').classList.remove('erro'); $('num').classList.remove('erro');
  let erro = false;
  if(!nome){ alert("Preencha o Nome"); return; }
  if(!turma){ $('tu').classList.add('erro'); erro=true; }
  if(!num){ $('num').classList.add('erro'); erro=true; }
  if(erro){ alert("Preencha Turma e Nº para iniciar"); return; }

  const chave = getChaveAluno(turma, num, config.senha);
  if(localStorage.getItem(chave)){
    $('tela-aluno').innerHTML = `<div class="bloqueado"><h2>ACESSO BLOQUEADO</h2><p>Aluno da Turma ${turma} Nº ${num} já realizou esta avaliação.</p><p>Prova: ${config.tipo} - ${config.disciplina}</p></div>`;
    return;
  }

  aluno={nome,turma,num};
  provaIniciada=true;
  montar();
  monitorarSaida();
}

function monitorarSaida(){
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden && provaIniciada){
      saidas--;
      if($('contadorSaidas')) $('contadorSaidas').innerText = `Saídas: ${saidas}`;
      if(saidas <= 0){
        alert("Limite de saídas atingido! Prova será finalizada.");
        finalizar();
      } else {
        alert(`Atenção! Você saiu da prova. Restam ${saidas} saídas.`);
      }
    }
  });
}

function embaralhar(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a}
function salvarResposta(i, val){ respostasAluno[i] = parseInt(val); }

function montar(){
  respostasAluno = [];
  let basePerg = [...config.perguntas];
  if(config.nPerg) basePerg=basePerg.slice(0,parseInt(config.nPerg));
  basePerg = embaralhar(basePerg);

  perguntas = [];
  let html=`<div id="contadorSaidas">Saídas: ${saidas}</div><div class="escola-cabecalho"><h2>${NOME_ESCOLA}</h2></div><h3>${config.disciplina} - ${aluno.nome}</h3>`;

  basePerg.forEach((p,i)=>{
    let ops=p.opcoes.map((o,j)=>({txt:o, idx:j}));
    ops=embaralhar(ops);
    perguntas.push({gab:p.certa});
    html+=`<div class="questao"><p><b>${i+1}.</b> ${p.enun}</p>`;
    if(p.imagem) html+=`<img src="${p.imagem}">`;
    ops.forEach((o,j)=>html+=`<label style="text-align:left;display:block"><input type="radio" name="q${i}" value="${o.idx}" onchange="salvarResposta(${i},${o.idx})"> ${o.txt}</label>`);
    html+=`</div>`;
  });

  html+=`<button class="btn btn-red" onclick="finalizar()">FINALIZAR</button>`;
  $('tela-aluno').innerHTML=html;
}

function gerarPDF(){
  const doc = new jsPDF();
  doc.setFontSize(16);
  doc.text(NOME_ESCOLA, 105, 20, {align:"center"});
  doc.setFontSize(12);
  doc.text(`COMPROVATIVO DE AVALIAÇÃO`, 105, 30, {align:"center"});
  doc.line(20, 35, 190, 35);
  doc.text(`Aluno: ${aluno.nome}`, 20, 45);
  doc.text(`Turma: ${aluno.turma} Nº: ${aluno.num}`, 20, 53);
  doc.text(`Disciplina: ${config.disciplina}`, 20, 61);
  doc.text(`Tipo: ${config.tipo}`, 20, 69);
  doc.text(`Data: ${config.data}`, 20, 77);
  doc.setFontSize(20);
  doc.text(`NOTA: ${notaFinal}/${cotacaoFinal}`, 105, 95, {align:"center"});
  doc.setFontSize(10);
  doc.text(`Sistema SAVM - ${new Date().toLocaleString()}`, 105, 110, {align:"center"});
  doc.save(`Comprovativo_${aluno.nome}.pdf`);
}

function enviarNotaWhats(){
  const msg = `*RESULTADO SAVM*%0A%0A*Aluno:* ${aluno.nome}%0A*Turma:* ${aluno.turma} Nº${aluno.num}%0A*Disciplina:* ${config.disciplina}%0A*Tipo:* ${config.tipo}%0A*Nota:* ${notaFinal}%0A*Data:* ${config.data}`;
  const url = `https://wa.me/${config.whats}?text=${msg}`;
  window.open(url, '_blank');
}

function finalizar(){
  provaIniciada=false;
  let ac=0;
  perguntas.forEach((p,i)=>{ if(respostasAluno[i] === p.gab) ac++; });
  const totalQ = perguntas.length;
  cotacaoFinal = parseFloat(config.cotacao) || 20;
  notaFinal = totalQ > 0? ((ac / totalQ) * cotacaoFinal).toFixed(1) : 0;

  const chave = getChaveAluno(aluno.turma, aluno.num, config.senha);
  localStorage.setItem(chave, JSON.stringify({nome:aluno.nome, nota:notaFinal, data:new Date().toLocaleString()}));

  $('tela-aluno').innerHTML = `
  <div class="comprovativo">
    <h2>AVALIAÇÃO FINALIZADA</h2>
    <p><b>${aluno.nome}</b></p>
    <p>${config.disciplina} - ${config.tipo}</p>
    <div class="nota">${notaFinal}</div>
    <button class="btn btn-green" onclick="gerarPDF()">Baixar Comprovativo PDF</button>
    <button class="btn btn-whats" onclick="enviarNotaWhats()">Enviar Nota ao Professor</button>
  </div>`;

  setTimeout(enviarNotaWhats, 1000);
}

if(location.search.includes('t=')) abrir();
</script>
</body>
</html>
