<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAVM - Sistema de Avaliação Virtual Mazivila</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f4f6f9}
header{background:#0a4d68;color:#fff;padding:20px;text-align:center}
header h1{margin:0;font-size:24px}
.container{max-width:900px;margin:20px auto;padding:20px;background:#fff;border-radius:8px}
input,textarea{width:100%;padding:8px;margin:5px 0;border:1px solid #ccc;border-radius:4px}
.pergunta{border:1px dashed #0a4d68;padding:15px;margin:15px 0;border-radius:6px;background:#f8f9fa}
.btn{background:#0a4d68;color:#fff;border:none;padding:10px 18px;border-radius:5px;cursor:pointer;margin:5px;font-weight:bold}
.btn-green{background:#28a745}.btn-red{background:#dc3545}
.hidden{display:none}
.resultado{background:#e7f3ff;padding:15px;margin-top:10px;border-radius:5px;border-left:4px solid #0a4d68}
</style>
</head>
<body>

<header>
    <h1>Escola Secundária de Mazivila</h1>
  <p>SAVM-Sistema de Avaliação Virtual Mazivila</p>
</header>

<div class="container" id="tela-prof">
  <h2>I.Dados</h2>
  <label>Tipo de Avaliação <input id="tipo"></label>
  <label>Disciplina <input id="disciplina"></label>
  <label>Classe <input id="classe"></label>
  <label>Data de avaliação<input id="data" type="date"></label>
  <label>Nº do WhatsApp do professor<input id="whats" placeholder="25884xxxxxxx"></label>
  <label>Nº de Perguntas <input id="nPerg" type="number" value="2"></label>
  <label>Cotação Total <input id="cot" type="number" value="20"></label>
  <label>Nº de saídas permitidas <input id="saidas" type="number" value="3"></label>

  <h2>II.Perguntas da avaliação</h2>
  <div id="perguntas"></div>
  <button class="btn" onclick="addP()">+ Adicionar Pergunta</button>

  <h2>III.Gerar Avaliação</h2>
  <button class="btn" onclick="gerarECurtar()">Gerar Link Curto do Teste</button>
  <div id="link" class="hidden resultado"></div>

</div>

<script>
const { jsPDF } = window.jspdf;
let banco=[], aluno={}, saidas=3, perguntas=[], respostasAluno=[], cont=0, config=null;
const $ = id => document.getElementById(id);

function addP(){
  const i=cont++;
  const div = document.createElement('div');
  div.className = 'pergunta';
  div.id = 'p'+i;
  div.innerHTML = `<button style="float:right;background:#dc3545;color:#fff;border:none;padding:5px 10px;border-radius:3px" onclick="this.parentElement.remove()">X</button>
    <label><b>Pergunta ${i+1}</b></label><textarea id="e${i}" placeholder="Digite a pergunta"></textarea>
    <label><input type="radio" name="c${i}" value="0"> <input id="o${i}0" placeholder="Opção A"></label>
    <label><input type="radio" name="c${i}" value="1"> <input id="o${i}1" placeholder="Opção B"></label>
    <label><input type="radio" name="c${i}" value="2"> <input id="o${i}2" placeholder="Opção C"></label>
    <label><input type="radio" name="c${i}" value="3"> <input id="o${i}3" placeholder="Opção D"></label>`;
  $('perguntas').appendChild(div);
}
addP(); addP(); // já cria 2 perguntas

function formatarWhats(num){
  let n = num.replace(/\D/g,'');
  if(n.startsWith('258')) return n;
  if(n.startsWith('0')) n = n.substring(1);
  return '258' + n;
}

function coletar(){
  banco=[];
  document.querySelectorAll('.pergunta').forEach(p=>{
    const i=p.id.substring(1);
    const en=$('e'+i)?.value.trim();
    const ce=$(`input[name="c${i}"]:checked`);
    const op=[0,1,2,3].map(j=>$(`o${i}${j}`)?.value.trim()||"").filter(x=>x!="");
    if(en && op.length >= 2){
      banco.push({enun:en, opcoes:op, certa:ce?parseInt(ce.value):0});
    }
  });
  if(banco.length == 0){ alert("Adicione pelo menos 1 pergunta completa"); return null; }
  return {
    tipo:$('tipo').value, disciplina:$('disciplina').value, classe:$('classe').value, data:$('data').value,
    whats:formatarWhats($('whats').value), nPerg:$('nPerg').value, cotacao:$('cot').value, saidas:$('saidas').value,
    senha:`SAVM-${$('classe').value}-${$('disciplina').value}-${$('tipo').value}-${$('data').value}`.toUpperCase(),
    perguntas:banco
  }
}

const cod = c => btoa(encodeURIComponent(JSON.stringify(c)));
const gerarId = () => Math.random().toString(36).substr(2,6).toUpperCase();

function gerarECurtar(){
  const c=coletar();
  if(!c) return;
  if(!c.whats){alert("Preencha o WhatsApp do professor com números");return;}

  const linkGigante = location.href.split('?')[0]+'?t='+cod(c);
  const id = gerarId();
  let bancoLinks = JSON.parse(localStorage.getItem('SAVM_LINKS') || '{}');
  bancoLinks[id] = linkGigante;
  localStorage.setItem('SAVM_LINKS', JSON.stringify(bancoLinks));
  const linkCurto = location.href.split('?')[0].replace('index.html','') + 's.html?id=' + id;

  $('link').classList.remove('hidden');
  $('link').innerHTML=`<b>✓ Link Curto Gerado:</b><br><a href="${linkCurto}" target="_blank">${linkCurto}</a><br>
  <button class="btn btn-green" onclick="navigator.clipboard.writeText('${linkCurto}');alert('Copiado')">Copiar</button>`;
}
</script>
</body>
</html>
