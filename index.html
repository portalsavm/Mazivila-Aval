<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAVM - Sistema Avaliações Mazivila</title>
<style>
:root{--v:#0a7;--a:#e67e22;--r:#c0392b;--g:#f5f7fa}
*{box-sizing:border-box;font-family:Segoe UI,Arial}
body{margin:0;background:var(--g);color:#222}
header{background:var(--v);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px}
.wrap{max-width:900px;margin:16px auto;padding:0 12px}
.card{background:#fff;border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 2px 6px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
label{display:flex;flex-direction:column;font-size:13px;gap:4px}
input,select,button,textarea{padding:9px;border:1px solid #ccc;border-radius:6px;font-size:14px}
input:focus,textarea:focus{border-color:var(--v);outline:none}
.btn{background:var(--v);color:#fff;border:0;cursor:pointer;font-weight:600}
.btn:hover{opacity:.9}
.btn-red{background:var(--r)}
.btn-orange{background:var(--a)}
.btn-green{background:#27ae60}
.hidden{display:none}
.q{border:1px dashed #ccc;padding:10px;border-radius:8px;margin:8px 0}
small{color:#666}
</style>
</head>
<body>
<header><b>SAVM</b><span>Sistema de Avaliações Mazivila</span></header>
<div class="wrap">

<!-- PAINEL PROFESSOR -->
<div class="card">
  <h2>Painel do Professor</h2>
  <div class="grid">
    <label>Disciplina<input id="disciplina" placeholder="MATEMATICA"></label>
    <label>Tipo<input id="tipo" placeholder="1ª ACS"></label>
    <label>Data<input id="data" type="date"></label>
    <label>Tempo min<input id="tempo" type="number" value="40"></label>
    <label>WhatsApp Prof<input id="whats" placeholder="25884xxxxxxx"></label>
  </div>
  <button class="btn" onclick="addP()">+ Adicionar Pergunta</button>
  <button class="btn btn-orange" onclick="gerarLink()">Gerar Link do Teste</button>
  <div id="link" class="hidden" style="margin-top:10px"></div>
</div>

<div id="perguntas"></div>

<!-- TELA DO ALUNO -->
<div id="telaAluno" class="card hidden">
  <h2>Iniciar Prova</h2>
  <div class="grid">
    <label>Nº do Aluno<input id="num" required></label>
    <label>Nome<input id="nome" required></label>
    <label>Turma
      <input id="tu" maxlength="2" placeholder="A ou A5" required>
      <small style="color:#a00;font-size:11px">Máx 2 caracteres. Ex: A, 10, B5</small>
    </label>
  </div>
  <button class="btn btn-green" onclick="iniciar()">Iniciar Prova</button>
  <p id="erro" style="color:var(--r)"></p>
</div>

<div id="prova" class="card hidden">
  <div style="display:flex;justify-content:space-between"><b id="cab"></b><b id="timer"></b></div>
  <div id="questoes"></div>
  <button class="btn btn-red" onclick="entregar()">Entregar Prova</button>
</div>

</div>

<script>
const FIREBASE_URL = "https://maziva--links-default-rtdb.firebaseio.com/links.json";
let config={}, perguntas=[], respostas={}, timerInt;

// UTILS
const $=id=>document.getElementById(id);
const gerarID=()=>Math.random().toString(36).substr(2,6).toUpperCase();
const cod=obj=>btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
const dec=str=>JSON.parse(decodeURIComponent(escape(atob(str))));

// BLOQUEIO: SENHA + TURMA DO ALUNO + NUMERO
function verificarBloqueio(num, turma, senha){
  try{
    let chave = `BLOQ_${senha}_${turma}`;
    return JSON.parse(localStorage.getItem(chave)||'[]').includes(num);
  } catch(e){ return false; }
}
function salvarBloqueio(num, turma, senha){
  try{
    let chave = `BLOQ_${senha}_${turma}`;
    let l=JSON.parse(localStorage.getItem(chave)||'[]');
    if(!l.includes(num)) l.push(num);
    localStorage.setItem(chave,JSON.stringify(l));
  } catch(e){}
}

// PROFESSOR
function addP(){
  perguntas.push({t:'objetiva',p:'',o:['','','',''],c:0});
  renderP();
}
function renderP(){
  $('perguntas').innerHTML=perguntas.map((q,i)=>`
  <div class="card">
    <b>Pergunta ${i+1}</b>
    <select onchange="perguntas[${i}].t=this.value">
      <option value="objetiva">Objetiva</option><option value="texto">Texto</option>
    </select>
    <input placeholder="Enunciado" oninput="perguntas[${i}].p=this.value">
    ${q.t==='objetiva'?q.o.map((o,j)=>`
      <input placeholder="Opção ${j+1}" value="${o}" oninput="perguntas[${i}].o[${j}]=this.value">
      <input type="radio" name="c${i}" ${q.c==j?'checked':''} onchange="perguntas[${i}].c=${j}"> Correta
    `).join(''):'<textarea placeholder="Resposta dissertativa" oninput="perguntas[${i}].p2=this.value"></textarea>'}
    <button class="btn-red" onclick="perguntas.splice(${i},1);renderP()">Remover</button>
  </div>`).join('');
}

function coletar(){
  if(!$('disciplina').value||!$('tipo').value||!$('data').value){alert('Preencha Disciplina,Tipo e Data');return}
  config={
    disciplina:$('disciplina').value,
    tipo:$('tipo').value,
    data:$('data').value,
    tempo:+$('tempo').value,
    senha:`SAVM-${$('disciplina').value}-${$('tipo').value}-${$('data').value}`.toUpperCase(),
    perguntas
  };
  return config;
}

async function gerarLink(){
  const cfg=coletar(); if(!cfg)return;
  const id=gerarID();
  const linkGigante = location.origin + location.pathname + '?t=' + cod(cfg);
  const linkCurto = `${location.origin}/Mazivila-Aval/s/${id}`;
  $('link').classList.remove('hidden');
  $('link').innerHTML=`Gerando...`;
  await fetch(FIREBASE_URL,{method:"POST",body:JSON.stringify({[id]:linkGigante})});
  $('link').innerHTML=`
    <b>✓ Link Gerado:</b><br>
    <a href="${linkCurto}" target="_blank">${linkCurto}</a><br><br>
    <button class="btn btn-green" onclick="mandarWhats('${linkCurto}')">Enviar no WhatsApp</button>
  `;
}
function mandarWhats(link){
  const num=$('whats').value;
  window.open(`https://wa.me/${num}?text=Prova SAVM: ${link}`);
}

// ALUNO
function checkURL(){
  const u=new URLSearchParams(location.search).get('t');
  if(u){
    config=dec(u);
    $('telaAluno').classList.remove('hidden');
    $('cab').innerText=`${config.disciplina} - ${config.tipo} - ${config.tempo}min`;
  }
}

// FUNÇÃO INICIAR COM TRAVA DE 2 CARACTERES
function iniciar(){
  const aluno={
    num:$('num').value.trim(),
    nome:$('nome').value.trim(),
    turma:$('tu').value.trim().toUpperCase()
  };
  
  // TRAVA 1: Campo vazio
  if(!aluno.num||!aluno.nome||!aluno.turma){
    alert('Preencha todos os campos: Nº, Nome e Turma');
    return
  }
  
  // TRAVA 2: Turma tem que ter 1 ou 2 caracteres - IMPLACÁVEL
  if(aluno.turma.length < 1 || aluno.turma.length > 2){
    alert('ERRO: Campo Turma inválido!\n\nUse apenas 1 ou 2 caracteres.\nExemplos válidos: A, 5, 10, B5');
    $('tu').focus();
    $('tu').style.border = '2px solid red';
    return // NÃO DEIXA AVANÇAR
  }
  $('tu').style.border = '1px solid #ccc'; // volta cor normal
  
  // TRAVA 3: Bloqueio por Nº + Turma
  if(verificarBloqueio(aluno.num, aluno.turma, config.senha)){
    $('erro').innerText='Você já realizou esta prova nesta turma.';
    return;
  }
  
  salvarBloqueio(aluno.num, aluno.turma, config.senha);
  $('telaAluno').classList.add('hidden');
  $('prova').classList.remove('hidden');
  montarProva(aluno);
  iniciarTimer(config.tempo*60);
}

function montarProva(aluno){
  $('questoes').innerHTML=config.perguntas.map((q,i)=>`
  <div class="q"><b>${i+1}. ${q.p}</b>
  ${q.t==='objetiva'?q.o.map((o,j)=>`
    <label><input type="radio" name="q${i}" value="${j}"> ${o}</label><br>
  `).join(''):`<textarea rows=3 oninput="respostas[${i}]=this.value"></textarea>`}
  </div>`).join('');
}

function iniciarTimer(s){
  clearInterval(timerInt);
  timerInt=setInterval(()=>{
    let m=Math.floor(s/60),sec=s%60;
    $('timer').innerText=`${m}:${sec<10?'0':''}${sec}`;
    if(--s<0){clearInterval(timerInt);entregar()}
  },1000);
}

function entregar(){
  clearInterval(timerInt);
  config.perguntas.forEach((q,i)=>{
    const sel=document.querySelector(`input[name=q${i}]:checked`);
    respostas[i]=sel?+sel.value:'';
  });
  let acertos=0;
  let totalObj = config.perguntas.filter(q=>q.t==='objetiva').length;
  config.perguntas.forEach((q,i)=>{if(q.t==='objetiva'&&respostas[i]==q.c)acertos++});
  const nota= totalObj > 0 ? (acertos/totalObj*20).toFixed(1) : 'N/A';
  alert(`Prova entregue!\nNota: ${nota}/20`);
  $('prova').classList.add('hidden');
}

// Força maiúscula na turma enquanto digita
document.addEventListener('DOMContentLoaded', ()=>{
  const inputTurma = $('tu');
  if(inputTurma){
    inputTurma.addEventListener('input', e=>{
      e.target.value = e.target.value.toUpperCase();
    });
  }
});

checkURL();
</script>
</body>
</html>
