<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAVM - Sistema de Avaliação Virtual Mazivila</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f4f6f9}
header{background:#0a4d68;color:#fff;padding:20px;text-align:center}
header h1{margin:0;font-size:24px}
.container{max-width:900px;margin:20px auto;padding:20px;background:#fff;border-radius:8px}
input,textarea{width:100%;padding:8px;margin:5px 0;border:1px solid #ccc;border-radius:4px}
.pergunta{border:1px dashed #0a4d68;padding:15px;margin:15px 0;border-radius:6px;background:#f8f9fa;position:relative}
.btn{background:#0a4d68;color:#fff;border:none;padding:10px 18px;border-radius:5px;cursor:pointer;margin:5px;font-weight:bold}
.btn-green{background:#28a745}.btn-red{background:#dc3545}.btn-whats{background:#25D366}.btn-blue{background:#007bff}.btn-excel{background:#217346}
.btn-small{padding:10px 14px;font-size:20px;background:#0a4d68;display:inline-flex;align-items:center;justify-content:center;width:50px;height:50px} /* CORRIGIDO */
.hidden{display:none}
.resultado{background:#e7f3ff;padding:15px;margin-top:10px;border-radius:5px;border-left:4px solid #0a4d68}
#tela-aluno{position:fixed;inset:0;background:#fff;z-index:9999;overflow:auto;padding:15px}
#contadorSaidas{position:fixed;top:10px;right:10px;background:#dc3545;color:#fff;padding:10px;border-radius:8px;font-weight:bold;z-index:10000}
.comprovativo{text-align:center;padding:30px;background:#d4edda;border:3px solid #28a745;border-radius:10px}
.nota{font-size:50px;color:#28a745;font-weight:bold;margin:15px 0}
.questao{margin:20px 0;padding-bottom:10px;border-bottom:1px solid #eee;text-align:center}
.questao img{max-width:400px;width:100%;height:auto;margin:10px auto;display:block;border:1px solid #ccc;border-radius:5px}
.escola-cabecalho{text-align:center;padding:10px;background:#0a4d68;color:#fff;margin-bottom:15px;border-radius:5px}
.erro{border:2px solid red!important}
.bloqueado{text-align:center;padding:50px;background:#f8d7da;border:3px solid #dc3545;border-radius:10px;color:#721c24}
.aviso-vermelho{color:#dc3545;font-size:12px;font-weight:bold;margin-bottom:8px}
label input[type="radio"]{width:auto;margin-right:5px}
.img-box{border:1px solid #ccc;padding:10px;border-radius:5px;margin:10px 0;background:#fff;text-align:center}
.preview-img{max-width:400px;width:100%;height:auto;margin:10px auto;display:block;border:1px solid #ccc;border-radius:4px;position:relative}
.btn-remove-img{position:absolute;top:5px;right:5px;background:#dc3545;color:#fff;border:none;border-radius:50%;width:25px;height:25px;cursor:pointer;font-weight:bold}
.img-opcoes{display:flex;justify-content:center;gap:10px;margin-top:8px} /* CORRIGIDO */
#cameraModal{position:fixed;inset:0;background:#000;z-index:10001;display:none;flex-direction:column;align-items:center;justify-content:center}
#cameraVideo{width:100%;max-width:500px}
#cameraCanvas{display:none}
.camera-botoes{margin-top:10px}
.upload-status{font-size:12px;color:#28a745;margin-top:5px}
.carregando{color:#0a4d68}
table{width:100%;border-collapse:collapse;margin-top:15px}
table th{background:#0a4d68;color:#fff;padding:10px;text-align:left}
table td{padding:10px;border-bottom:1px solid #ddd}
</style>
</head>
<body>

<header>
    <h1>Escola Secundária de Mazivila</h1>
  <p>SAVM-Sistema de Avaliação Virtual Mazivila</p>
</header>

<div class="container" id="tela-prof">
  <h2>I.Dados</h2>
  <label>Tipo de Avaliação <input id="tipo" placeholder="1ªACS/2ªACS/Teste de recuperação/Trabalho"></label>
  <label>Disciplina <input id="disciplina"></label>
  <label>Classe <input id="classe" placeholder=""></label>
  <label>Data de avaliação<input id="data" type="date"></label>
  <label>Nº do WhatsApp do professor<input id="whats" placeholder="+258xxxxxxxxx"></label>
  <label>Nº de Perguntas <input id="nPerg" type="number" value=""></label>
  <label>Cotação Total <input id="cot" type="number" value="20"></label>
  <label>Nº de saídas permitidas <input id="saidas" type="number" value="" min="1"></label>

  <h2>II.Perguntas da avaliação</h2>
  <div id="perguntas"></div>
  <button class="btn" onclick="addP()">+ Adicionar Pergunta</button>

  <h2>III.Gerar Avaliação</h2>
  <button class="btn" onclick="gerarECurtar()">Gerar Link</button>
  <button class="btn btn-blue" onclick="verRelatorio()"> Relatório de Notas</button>
  <div id="link" class="hidden resultado"></div>
  <div id="relatorio" class="hidden resultado"></div>

</div>

<div id="tela-aluno" class="hidden"></div>

<div id="cameraModal">
  <video id="cameraVideo" autoplay playsinline></video>
  <canvas id="cameraCanvas"></canvas>
  <div class="camera-botoes">
    <button class="btn btn-green" onclick="tirarFoto()">Tirar Foto</button>
    <button class="btn btn-red" onclick="fecharCamera()">Cancelar</button>
  </div>
</div>

<script>
const { jsPDF } = window.jspdf;
let banco=[], aluno={}, saidas=3, perguntas=[], respostasAluno=[], cont=0, config=null, notaFinal=0, cotacaoFinal=20, linkGerado="", provaIniciada=false;
let streamAtual=null, perguntaCameraAtual=null;
const NOME_ESCOLA = "Escola Secundária de Mazivila";
const IMGBB_KEY = "427e4d6479c56aba1bee0eaadaa4b985";
const $ = id => document.getElementById(id);

function addP(){
  const i=cont++;
  const div = document.createElement('div');
  div.className = 'pergunta';
  div.id = 'p'+i;
  div.innerHTML = `<button style="float:right;background:#dc3545;color:#fff;border:none;padding:5px 10px;border-radius:3px" onclick="this.parentElement.remove()">X</button>
    <p class="aviso-vermelho">Aviso: Marque a alternativa A como correta</p>
    <label><b>Pergunta ${i+1}</b></label><textarea id="e${i}" placeholder="Digite a pergunta"></textarea>

    <div class="img-box">
      <b>Imagem da Pergunta - Opcional</b>
      <div id="imgContainer${i}"></div>
      <div class="img-opcoes">
        <label class="btn btn-small" title="Galeria">🖼️<input type="file" id="galeria${i}" accept="image/*" style="display:none" onchange="lerArquivo(this, ${i})"></label>
        <button type="button" class="btn btn-small" title="Câmera" onclick="abrirCamera(${i})">📷</button> <!-- CORRIGIDO: type button -->
        <a href="https://www.google.com/imghp" target="_blank" class="btn btn-small" title="Buscar no Google">🔍</a>
      </div>
      <div id="status${i}" class="upload-status"></div>
      <input type="hidden" id="img${i}">
    </div>

    <label><input type="radio" name="c${i}" value="0" checked> <input id="o${i}0" placeholder="A"></label>
    <label><input type="radio" name="c${i}" value="1"> <input id="o${i}1" placeholder="B"></label>
    <label><input type="radio" name="c${i}" value="2"> <input id="o${i}2" placeholder="C"></label>
    <label><input type="radio" name="c${i}" value="3"> <input id="o${i}3" placeholder="D"></label>`;
  $('perguntas').appendChild(div);
}
addP(); addP();

// O RESTO DO JS É IGUAL AO QUE TE MANDEI ANTES COM IMGBB
async function uploadImgBB(base64, i){
  $(`status${i}`).innerHTML = `<span class="carregando">Enviando imagem...</span>`;
  const formData = new FormData();
  formData.append("image", base64.split(',')[1]);
  try{
    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, {method: "POST", body: formData});
    const data = await res.json();
    if(data.success){
      $(`status${i}`).innerHTML = `<span>✓ Imagem enviada</span>`;
      return data.data.url;
    }else{ throw new Error(data.error.message); }
  }catch(e){
    $(`status${i}`).innerHTML = `<span style="color:red">Erro ao enviar</span>`;
    alert("Erro ao enviar imagem: " + e.message);
    return "";
  }
}

async function abrirCamera(i){
  perguntaCameraAtual = i;
  $('cameraModal').style.display = 'flex';
  try{
    streamAtual = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}});
    $('cameraVideo').srcObject = streamAtual;
  }catch(e){
    alert("Não foi possível acessar a câmera: " + e.message + "\n\nDica: Use em https://");
    fecharCamera();
  }
}

function fecharCamera(){
  $('cameraModal').style.display = 'none';
  if(streamAtual){
    streamAtual.getTracks().forEach(track => track.stop());
    streamAtual = null;
  }
}

async function tirarFoto(){
  const video = $('cameraVideo');
  const canvas = $('cameraCanvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
  fecharCamera();
  const url = await uploadImgBB(dataUrl, perguntaCameraAtual);
  if(url) setImagem(perguntaCameraAtual, url);
}

async function lerArquivo(input, i){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    let img = new Image();
    img.onload = async function(){
      let canvas = document.createElement('canvas');
      let ctx = canvas.getContext('2d');
      let maxW = 1000;
      let scale = maxW / img.width;
      canvas.width = maxW;
      canvas.height = img.height * scale;
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      const url = await uploadImgBB(dataUrl, i);
      if(url) setImagem(i, url);
    }
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  input.value = "";
}

function setImagem(i, src){
  $(`img${i}`).value = src;
  $(`imgContainer${i}`).innerHTML = `<div style="position:relative;display:inline-block"><img src="${src}" class="preview-img"><button class="btn-remove-img" onclick="removerImagem(${i})">X</button></div>`;
}

function removerImagem(i){
  $(`img${i}`).value = "";
  $(`imgContainer${i}`).innerHTML = "";
  $(`status${i}`).innerHTML = "";
}

function formatarWhats(num){ let n = num.replace(/\D/g,''); if(n.startsWith('258')) return n; if(n.startsWith('0')) n = n.substring(1); return '258' + n; }

function coletar(){
  banco=[];
  document.querySelectorAll('.pergunta').forEach(p=>{
    const i=p.id.substring(1);
    const en=$(`e${i}`)?.value.trim();
    const ce=$(`input[name="c${i}"]:checked`);
    const op=[0,1,2,3].map(j=>$(`o${i}${j}`)?.value.trim()||"").filter(x=>x!="");
    const imagem = $(`img${i}`)?.value.trim();

    if(en && op.length >= 2){ banco.push({enun:en, opcoes:op, certa:ce?parseInt(ce.value):0, imagem: imagem || ""}); }
  });
  if(banco.length == 0){ alert("Adicione pelo menos 1 pergunta completa"); return null; }
  let saidasProf = parseInt($('saidas').value);
  if(saidasProf < 1) saidasProf = 1;
  const senha = `SAVM-${$('classe').value}-${$('disciplina').value}-${$('tipo').value}-${$('data').value}`.toUpperCase();
  return { tipo:$('tipo').value, disciplina:$('disciplina').value, classe:$('classe').value, data:$('data').value, whats:formatarWhats($('whats').value), nPerg:$('nPerg').value, cotacao:$('cot').value, saidas:saidasProf, senha: senha, perguntas:banco }
}

const cod = c => btoa(encodeURIComponent(JSON.stringify(c)));
const dec = c => JSON.parse(decodeURIComponent(atob(c)));
const gerarId = () => Math.random().toString(36).substr(2,6).toUpperCase();

function gerarECurtar(){
  const c=coletar();
  if(!c) return;
  if(!c.tipo ||!c.disciplina ||!c.classe ||!c.data){alert("Preencha Tipo, Disciplina, Classe e Data");return;}
  if(!c.whats){alert("Preencha o WhatsApp do professor com números");return;}
  const enviando = document.querySelector('.carregando');
  if(enviando){ alert("Aguarde terminar de enviar as imagens"); return; }

  // CORREÇÃO: Link direto com?t=
  linkGerado = location.href.split('?')[0] + '?t=' + cod(c);

  $('link').classList.remove('hidden');
  $('relatorio').classList.add('hidden');
  $('link').innerHTML=`<b>Link Curto Gerado:</b><br><a href="${linkGerado}" target="_blank">${linkGerado}</a><br>
  <button class="btn btn-green" onclick="navigator.clipboard.writeText('${linkGerado}');alert('Copiado')">Copiar</button>
  <button class="btn btn-whats" onclick="enviarWhats()">Enviar no WhatsApp</button>`;
    }
// COPIA O RESTO DAS FUNÇÕES: verRelatorio, apagarRelatorio, exportarExcel, enviarWhats, abrir, iniciar, etc...
// É igual ao código anterior

</script>
</body>
</html>
